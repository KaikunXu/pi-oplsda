[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-oplsda"
dynamic = ["version", "readme"]
authors = [
    { name="KaikunXu", email="xukaikun.bio@qq.com" },
]
keywords = [
    "chemistry",
    "metabolomics",
    "bioinformatics",
    "chemometrics",
    "lc-ms",
    "mass-spectrometry",
    "data-analysis",
    "statistics",
    "opls",
    "opls-da",
    "oplsda",
    "ropls",
    "scikit-learn",
    "multivariate analysis",
    "machine learning"
]
description = "A Python OPLS-DA estimator with scikit-learn style APIs, ropls-compatible computation modes, automatic orthogonal component selection, and publication-ready diagnostics."
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.2",
    "joblib>=1.3.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "tqdm>=4.65.0",
    "patchworklib>=0.6.2",
    "plotnine>=0.10.1"
]

[project.urls]
"Homepage" = "https://github.com/KaikunXu/pi-oplsda"
"Bug Tracker" = "https://github.com/KaikunXu/pi-oplsda/issues"
"Source" = "https://github.com/KaikunXu/pi-oplsda"
"Changelog" = "https://github.com/KaikunXu/pi-oplsda/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["piopls*"]

[tool.setuptools.package-data]
"piopls.data" = ["*.csv"]

[tool.setuptools.dynamic]
version = {attr = "piopls.__version__"}
readme = {file = "README.md", content-type = "text/markdown"}

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "tabulate>=0.10.0",
    "rpy2>=3.5.0",
    "packaging>=23.0",
    "pygments>=2.0",
    "python-dateutil>=2.8",
    "six>=1.16",
    "colorama>=0.4.6; platform_system == 'Windows'"
]
benchmark = [
    "rpy2>=3.5.0"
]
dev = [
    "pytest>=7.0.0",
    "tabulate>=0.10.0",
    "rpy2>=3.5.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "packaging>=23.0",
    "pygments>=2.0",
    "python-dateutil>=2.8",
    "six>=1.16",
    "colorama>=0.4.6; platform_system == 'Windows'"
]
